name: Research workflow

on:
  push:
  pull_request:

jobs:
  test-and-replay:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: RESEARCH_MAX_ROWS=2000 python run_research.py econometrics_III.ipynb --output research-output
      - run: python scripts/verify_demo.py
        if: ${{ hashFiles('docs/demo/capture.json') != '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: research-receipt-${{ matrix.python-version }}
          path: research-output/
